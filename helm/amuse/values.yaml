# values.yaml for the amuse umbrella chart
global:
  imageRegistry: registry.amuse.io
  imagePullSecrets: []
  storageClass: fast-ssd

jokeService:
  enabled: true
  replicaCount: 3
  image:
    repository: jokeService
    tag: ""
    pullPolicy: IfNotPresent
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 400
    targetCPUUtilizationPercentage: 60
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits:   {cpu: 2, memory: 4Gi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  serviceAccount:
    create: true
    annotations: {}
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s

